<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>360° バーチャル内見</title>
<link rel="stylesheet" href="viewer.css">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#111;overflow:hidden}
  #tour{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="tour"></div>
<script src="viewer.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var config = q.get('config') || q.get('tour') || 'tours/sample.json';
  // 相対パスは tours/ 配下として解決 (例: ?tour=abc → tours/abc.json)
  if (!/^(https?:|\/|\.\/|\.\.\/)/.test(config) && !/\//.test(config)) {
    config = 'tours/' + config + (/\.json$/i.test(config) ? '' : '.json');
  }
  var opts = {};
  if (q.get('scene')) opts.scene = q.get('scene');
  if (q.has('autorotate')) { var ar = q.get('autorotate'); opts.autoRotate = (ar === '' || ar === '1' || ar === 'true') ? 2 : (ar === '0' || ar === 'false' ? 0 : +ar); }
  if (q.get('yaw')) opts.yaw = +q.get('yaw');
  if (q.get('pitch')) opts.pitch = +q.get('pitch');
  if (q.get('hfov')) opts.hfov = +q.get('hfov');
  if (q.get('ui') === 'minimal') { opts.showThumbs = false; opts.showTitle = false; opts.showFloorplan = false; }
  if (q.get('thumbs') === '0') opts.showThumbs = false;
  if (q.get('title') === '0') opts.showTitle = false;
  if (q.get('plan') === '0') opts.showFloorplan = false;
  if (q.get('controls') === '0') opts.showControls = false;
  if (q.get('hint') === '0') opts.showHint = false;

  RicohTour.mount(document.getElementById('tour'), config, opts).then(function(v){
    window.viewer = v;
    if (v.config.title) document.title = v.config.title + ' | 360° バーチャル内見';
    // 親ページへ状態を通知 (埋め込み側で利用可能)
    v.on('scenechange', function(e){
      if (window.parent !== window) window.parent.postMessage({ type: 'ricohtour:scenechange', scene: e.scene.id, name: e.scene.name }, '*');
    });
  }).catch(function(e){ console.error(e); });

  // 親ページからの操作 (postMessage)
  window.addEventListener('message', function(ev){
    var d = ev.data; if (!d || !window.viewer || typeof d !== 'object') return;
    if (d.type === 'ricohtour:loadScene' && d.scene) window.viewer.loadScene(d.scene, d.view);
    if (d.type === 'ricohtour:setView' && d.view) window.viewer.setView(d.view);
    if (d.type === 'ricohtour:autorotate') window.viewer.toggleAutoRotate(!!d.enabled);
  });
})();
</script>
</body>
</html>
